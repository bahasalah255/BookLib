
services:
  auth-service:
    build: ./auth-service
    ports:
      - '3001:3001'
    env_file:
      - ./auth-service/.env
    depends_on:
      - mongo-auth
    networks:
      - booklib-network

  book-service:
    build: ./book-service
    ports:
      - '3002:3002'
    depends_on:
      - mongo-books
      - rabbitmq
    networks:
      - booklib-network

  borrow-service:
    build: ./borrow-service
    ports:
      - '3003:3003'
    depends_on:
      - mongo-borrows
      - rabbitmq
    networks:
      - booklib-network

  mongo-auth:
    image: mongo:6
    volumes:
      - mongo-auth-data:/data/db
    networks:
      - booklib-network

  mongo-books:
    image: mongo:6
    volumes:
      - mongo-books-data:/data/db
    networks:
      - booklib-network

  mongo-borrows:
    image: mongo:6
    volumes:
      - mongo-borrows-data:/data/db
    networks:
      - booklib-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - booklib-network

networks:
  booklib-network:
    driver: bridge

volumes:
  mongo-auth-data:
  mongo-books-data:
  mongo-borrows-data:
